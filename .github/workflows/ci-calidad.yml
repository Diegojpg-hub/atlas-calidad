name: CI Atlas - Calidad y Seguridad
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions
 
permissions:
  contents: read
 
jobs:
  # ------------------------------------------------------------------
  # 1) Pruebas unitarias/integración + análisis estático (SonarQube Cloud)
  # ------------------------------------------------------------------
  pruebas-y-calidad:
    name: 1. Jest + SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
 
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json

      - name: Probar diagnóstico de SonarCloud
        run: node --test .github/scripts/sonar-quality-gate-report.test.js
 
      - name: Instalar dependencias del backend
        working-directory: BACKEND
        run: npm ci
 
      - name: Ejecutar pruebas con cobertura
        working-directory: BACKEND
        run: npm run test:coverage
 
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: BACKEND/coverage
 
      - name: SonarQube Cloud - Backend
        id: sonar_backend
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: BACKEND
          skipSignatureVerification: false
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_KEY_BACKEND }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.scanner.metadataFilePath=${{ runner.temp }}/sonar-backend-task.txt

      - name: Detalle del Quality Gate - Backend
        if: ${{ failure() && steps.sonar_backend.outcome == 'failure' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_TASK_FILE: ${{ runner.temp }}/sonar-backend-task.txt
        run: node .github/scripts/sonar-quality-gate-report.js backend
 
      - name: SonarQube Cloud - Frontend
        id: sonar_frontend
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: FRONTEND
          skipSignatureVerification: false
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_KEY_FRONTEND }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.scanner.metadataFilePath=${{ runner.temp }}/sonar-frontend-task.txt

      - name: Detalle del Quality Gate - Frontend
        if: ${{ failure() && steps.sonar_frontend.outcome == 'failure' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_TASK_FILE: ${{ runner.temp }}/sonar-frontend-task.txt
        run: node .github/scripts/sonar-quality-gate-report.js frontend
 
  # ------------------------------------------------------------------
  # 2) Construir las imágenes Docker y escanearlas con Trivy
  # ------------------------------------------------------------------
  imagenes-y-trivy:
    name: 2. Docker build + Trivy (${{ matrix.nombre }})
    needs: pruebas-y-calidad
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: backend
            carpeta: BACKEND
          - nombre: frontend
            carpeta: FRONTEND
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5
 
      - name: Construir la imagen
        run: >
          docker build -t atlas-${{ matrix.nombre }}:${{ github.sha }}
          ./${{ matrix.carpeta }}

      - name: Verificar npm, node-gyp y expansión de llaves del backend
        if: ${{ matrix.nombre == 'backend' }}
        run: |
          set -eu
          fixtures="$(mktemp -d)"
          trap 'rm -f "$fixtures/key.pem" "$fixtures/cert.pem"; rmdir "$fixtures"' EXIT
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -quiet -out "$fixtures/key.pem"
          openssl req -new -x509 -sha256 -days 1 -key "$fixtures/key.pem" \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' \
            -out "$fixtures/cert.pem"
          chmod 755 "$fixtures"
          chmod 644 "$fixtures/key.pem" "$fixtures/cert.pem"
          docker run --rm --network none \
            --mount "type=bind,source=$fixtures,target=/test-fixtures,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/BACKEND/tests/container/node-gyp-undici.check.js,target=/node-gyp-undici.check.js,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/BACKEND/tests/container/brace-expansion.check.js,target=/brace-expansion.check.js,readonly" \
            --env TEST_NPM_ROOT=/usr/local/lib/npm-managed/node_modules/npm \
            --entrypoint node "atlas-backend:${{ github.sha }}" \
            --test --test-concurrency=1 /node-gyp-undici.check.js /brace-expansion.check.js

      - name: Analizar el backend con Trivy sin excepciones
        if: ${{ matrix.nombre == 'backend' }}
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: /dev/null
          TRIVY_VEX: ''
        with:
          image-ref: atlas-backend:${{ github.sha }}
          format: table
          output: ${{ runner.temp }}/trivy-backend-completo.txt
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Mostrar todos los hallazgos del backend
        if: ${{ matrix.nombre == 'backend' }}
        run: cat "$RUNNER_TEMP/trivy-backend-completo.txt"

      - name: Comprobar la evaluación de jws
        id: evaluar_jws
        if: ${{ matrix.nombre == 'backend' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/jws_vex_test.py
          image="atlas-backend:$GITHUB_SHA"
          inspection="$RUNNER_TEMP/atlas-backend-inspect.json"
          docker image inspect "$image" > "$inspection"
          container="$(docker create --network none "$image")"
          trap 'docker rm "$container" >/dev/null' EXIT
          image_id="$(docker container inspect --format '{{.Image}}' "$container")"
          docker export "$container" | python3 .github/scripts/jws_vex.py \
            --inspect "$inspection" --reference "$image" \
            --container-image-id "$image_id" --compose docker-compose.yml \
            --manifest-output "$RUNNER_TEMP/atlas-backend-huellas.json" \
            > "$RUNNER_TEMP/atlas-backend-jws.openvex.json"
          echo "::warning title=CVE-2025-65945::jws 3.2.2 se conserva sin reparar; el uso revisado no está afectado."
          {
            echo "### jws 3.2.2: CVE-2025-65945 (HIGH)"
            echo "El primer informe muestra el hallazgo sin excepciones. El control lo declara no afectado solo para la imagen y el uso revisados; no es una reparación."
            echo "El control conserva HIGH/CRITICAL e ignore-unfixed=true; los demás hallazgos que cumplen esos criterios siguen bloqueándolo."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar diagnóstico si cambia la imagen
        if: ${{ failure() && matrix.nombre == 'backend' && steps.evaluar_jws.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-huella-diagnostico
          path: |
            ${{ runner.temp }}/trivy-backend-completo.txt
            ${{ runner.temp }}/atlas-backend-huellas.json
          if-no-files-found: error

      - name: Guardar el informe completo y la evaluación de jws
        if: ${{ matrix.nombre == 'backend' }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-evaluacion-jws
          path: |
            ${{ runner.temp }}/trivy-backend-completo.txt
            ${{ runner.temp }}/atlas-backend-jws.openvex.json
          if-no-files-found: error

      - name: Escanear la imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: /dev/null
          TRIVY_VEX: ${{ matrix.nombre == 'backend' && format('{0}/atlas-backend-jws.openvex.json', runner.temp) || '' }}
          TRIVY_SHOW_SUPPRESSED: 'true'
        with:
          image-ref: atlas-${{ matrix.nombre }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: ${{ matrix.nombre == 'backend' }}
          cache: ${{ matrix.nombre != 'backend' }}
          # trivyignores: .trivyignore
 
  # ------------------------------------------------------------------
  # 3) Levantar Atlas completo y probarlo en ejecución
  # ------------------------------------------------------------------
  pruebas-sistema:
    name: 3. E2E + ZAP + k6
    needs: imagenes-y-trivy
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5
 
      - name: Crear el archivo .env desde los secretos
        run: |
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > .env
          echo "PORT_POSTGRES=15433" >> .env
          echo "PORT_BACKEND=4451"   >> .env
          echo "PORT_FRONTEND=3351"  >> .env
 
      - name: Preparar carpeta de archivos subidos
        run: mkdir -p BACKEND/uploads/contracts && chmod -R 777 BACKEND/uploads
 
      - name: Levantar Atlas con Docker Compose
        run: docker compose up -d --build
 
      - name: Esperar a que Atlas responda
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:4451/ > /dev/null \
               && curl -sf http://localhost:3351/ > /dev/null; then
              echo "Atlas está listo"; exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
 
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
 
      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
 
      - name: Pruebas E2E y de accesibilidad
        working-directory: e2e
        run: npx playwright test
 
      - name: Guardar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: e2e/playwright-report
 
      - name: ZAP - Escaneo pasivo del frontend
        if: always()
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3351
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-frontend
 
      - name: ZAP - Escaneo de la API (OpenAPI)
        if: always()
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://localhost:4451/openapi.json
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api
 
      - name: k6 - Prueba de humo de rendimiento
        if: always()
        run: |
          docker run --rm -i --network host grafana/k6 run \
            -e API_URL=http://localhost:4451 -e PERFIL=humo - < rendimiento/carga-clientes.js
 
      - name: Registros de los contenedores (si algo falló)
        if: failure()
        run: docker compose logs
 
      - name: Apagar Atlas
        if: always()
        run: docker compose down -v
 
  # ------------------------------------------------------------------
  # 4) Resumen del pipeline (aparece en la página de la ejecución)
  # ------------------------------------------------------------------
  resumen:
    name: 4. Resumen de calidad
    needs: [ pruebas-y-calidad, imagenes-y-trivy, pruebas-sistema ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Escribir resumen
        env:
          R1: ${{ needs.pruebas-y-calidad.result }}
          R2: ${{ needs.imagenes-y-trivy.result }}
          R3: ${{ needs.pruebas-sistema.result }}
        run: |
          {
            echo "## Resultado del pipeline de calidad de Atlas"
            echo ""
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| 1. Jest + SonarQube Cloud | $R1 |"
            echo "| 2. Docker + Trivy | $R2 |"
            echo "| 3. E2E + ZAP + k6 | $R3 |"
          } >> "$GITHUB_STEP_SUMMARY"
